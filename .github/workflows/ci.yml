name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Chrome availability
        run: which google-chrome chromium chromium-browser || true

      - name: Typecheck
        run: bun run compile

      - name: Run tests
        run: bun run test

      - name: Build production extension
        run: bun run build
